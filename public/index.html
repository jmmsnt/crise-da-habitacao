<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crise da Habitação</title>
    <meta name="description" content="Uma simulação 3D minimalista da crise da habitação em Lisboa e no interior." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H4z' fill='%23F2C14E'/%3E%3Cpath d='M2 16 16 4l14 12' fill='none' stroke='%23C4683F' stroke-width='3'/%3E%3Crect x='13' y='19' width='6' height='8' fill='%232F5D8A'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene" aria-label="Vista 3D"></canvas>
    <div id="labels"></div>

    <header class="topbar">
      <section class="card clock" id="clock" aria-label="Data e velocidade do jogo">
        <div class="clock-date" data-k="date">—</div>
        <div class="clock-progress"><span data-k="progress"></span></div>
        <div class="clock-controls">
          <div class="speeds" role="group" aria-label="Velocidade do jogo" data-k="speeds"></div>
          <span class="muted small" data-k="pace">1 min = 1 mês</span>
        </div>
        <div class="clock-score small"><span data-k="term"></span><b data-k="score"></b></div>
      </section>

      <nav class="tabs card" role="tablist" aria-label="Vistas">
        <button role="tab" data-view="parliament" aria-selected="false"><span class="kbd">1</span>Parlamento</button>
        <button role="tab" data-view="city" aria-selected="true"><span class="kbd">2</span>Lisboa · cidade</button>
        <button role="tab" data-view="countryside" aria-selected="false"><span class="kbd">3</span>Interior</button>
      </nav>
      <a class="card toplink" href="/scores.html" target="_blank" rel="noopener">Pontuações</a>
    </header>

    <aside class="card panel" id="panel">
      <button class="sheet-toggle" type="button" aria-expanded="false" aria-controls="panel"></button>
      <section data-panel="parliament" hidden></section>
      <section data-panel="city" hidden></section>
      <section data-panel="countryside" hidden></section>
    </aside>

    <section class="card status" id="status" aria-label="Indicadores"></section>

    <section class="ticker" id="ticker" aria-live="polite"></section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="overlay" id="overlay" hidden></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
